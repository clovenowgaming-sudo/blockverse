name: BlockVerse CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-and-tests:
    name: Core tests and desktop JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run smoke tests
        run: ./scripts/smoke-test.sh

      - name: Run core tests and build desktop JAR
        run: |
          gradle :core:test \
            :lwjgl3:compileJava \
            :lwjgl3:dist \
            --no-daemon

      - name: Upload desktop JAR
        uses: actions/upload-artifact@v4
        with:
          name: BlockVerse-desktop-jar
          path: lwjgl3/build/libs/BlockVerse-desktop-*.jar
          if-no-files-found: error
          retention-days: 14

  android-arm:
    name: Android ARM32 + ARM64 debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Android debug APK
        run: gradle :android:assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockVerse-android-arm32-arm64-debug
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
